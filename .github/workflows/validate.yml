name: Validate DOA standard

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt

      - name: Validate standard and schemas
        run: python scripts/validate_repository.py

      - name: Check whitespace errors
        run: git show --check --format= HEAD

      - name: Check release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
