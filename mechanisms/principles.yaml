# DOA Mechanism design principles (informative, версия 0.1, пилот).
# Принцип — инженерный вывод из карточки механизма. Он не является требованием: правило становится требованием
# только через порядок GOVERNANCE.md, раздел 4. candidate_tests — идеи проверок, не обязательные кейсы Verification Kit.
standard: DOA-FS-1.0
status: informative
principles:
  - id: P-01
    title: Градиент превращается в валюту
    summary: Ёмкость (разность потенциалов) превращается в единицу учёта через связку с известным курсом; курс обмена измерим.
    cards: [atp-synthase]
    doa_mechanisms: [M-12, C-16, M-06]
    candidate_tests: [Сверить курс обмена ресурса в бюджет по журналу и по внешней телеметрии, допуск объявить заранее.]
    status: candidate
  - id: P-02
    title: Защита от обратного хода
    summary: Когда источник ресурса пропал, накопленная валюта не расходуется впустую на поддержание потенциала.
    cards: [atp-synthase]
    doa_mechanisms: [M-13, M-14, M-12]
    candidate_tests: [Отключить источник ресурса в изолированной среде и проверить, что расход резерва ограничен объявленным пределом.]
    status: candidate
  - id: P-03
    title: Двухступенчатая проверка
    summary: Быстрый отбор плюс медленная корректура; выигрыш в точности есть, пока ступени независимы по источнику проверки.
    cards: [dna-polymerase-proofreading]
    doa_mechanisms: [C-05, C-26, E-01]
    candidate_tests: [Подать известные дефекты и измерить долю пропущенных первой ступенью и после второй; ступени проверяются разными источниками.]
    status: candidate
  - id: P-04
    title: Остановка как сигнал к проверке
    summary: Обнаруженная ошибка замедляет процесс и запускает проверку, а не проходит дальше незамеченной.
    cards: [dna-polymerase-proofreading]
    doa_mechanisms: [C-26, C-05, N-03]
    candidate_tests: [Вызвать сигнал ошибки и проверить, что продвижение по стадиям остановлено до завершения проверки.]
    status: candidate
  - id: P-05
    title: Три пути для брака
    summary: Дефектный объект получает исправление, пометку или утилизацию; контролёр качества и утилизатор — разные роли.
    cards: [proteostasis-chaperones-proteasome]
    doa_mechanisms: [C-10, C-18, C-19, M-04]
    candidate_tests: [Подать дефектные объекты и проверить, что каждый ушёл по одному из трёх путей и записан в audit.]
    status: candidate
  - id: P-06
    title: Перегрузка снижает нагрузку
    summary: У контроля качества конечная ёмкость; при перегрузке система ограничивает приток нового, а не пропускает брак.
    cards: [proteostasis-chaperones-proteasome]
    doa_mechanisms: [C-10, C-11, M-02]
    candidate_tests: [Перегрузить контроль качества и проверить, что приток ограничен, а доля пропущенных дефектов не выросла.]
    status: candidate
  - id: P-07
    title: Резерв на корректное завершение
    summary: Часть ресурса закреплена за процедурой завершения и не расходуется обычной нагрузкой, чтобы при дефиците завершение оставалось управляемым, а не аварийным.
    cards: [atp-and-cell-death-mode]
    doa_mechanisms: [M-12, M-13, C-27, C-28, M-14]
    candidate_tests: [В изолированной среде исчерпать бюджет организма и проверить, что клетка завершается по протоколу с отзывом прав и итоговой записью, а не уходит в аварийный отказ.]
    status: candidate
