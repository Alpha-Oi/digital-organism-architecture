# DOA Mechanism design principles (informative, версия 0.1, пилот).
# Принцип — инженерный вывод из карточки механизма. Он не является требованием: правило становится требованием
# только через порядок GOVERNANCE.md, раздел 4. candidate_tests — идеи проверок, не обязательные кейсы Verification Kit.
standard: DOA-FS-1.0
status: informative
principles:
  - id: P-01
    title: Градиент превращается в валюту
    summary: Ёмкость (разность потенциалов) превращается в единицу учёта через связку с известным курсом; курс обмена измерим.
    cards: [atp-synthase]
    doa_mechanisms: [M-12, C-16, M-06]
    candidate_tests: ["Сверить курс обмена ресурса в бюджет по журналу и по внешней телеметрии, допуск объявить заранее."]
    status: candidate
  - id: P-02
    title: Защита от обратного хода
    summary: Когда источник ресурса пропал, накопленная валюта не расходуется впустую на поддержание потенциала.
    cards: [atp-synthase]
    doa_mechanisms: [M-13, M-14, M-12]
    candidate_tests: ["Отключить источник ресурса в изолированной среде и проверить, что расход резерва ограничен объявленным пределом."]
    status: candidate
  - id: P-03
    title: Двухступенчатая проверка
    summary: Быстрый отбор плюс медленная корректура; выигрыш в точности есть, пока ступени независимы по источнику проверки.
    cards: [dna-polymerase-proofreading]
    doa_mechanisms: [C-05, C-26, E-01]
    candidate_tests: [Подать известные дефекты и измерить долю пропущенных первой ступенью и после второй; ступени проверяются разными источниками.]
    status: candidate
  - id: P-04
    title: Остановка как сигнал к проверке
    summary: Обнаруженная ошибка замедляет процесс и запускает проверку, а не проходит дальше незамеченной.
    cards: [dna-polymerase-proofreading]
    doa_mechanisms: [C-26, C-05, N-03]
    candidate_tests: ["Вызвать сигнал ошибки и проверить, что продвижение по стадиям остановлено до завершения проверки."]
    status: candidate
  - id: P-05
    title: Три пути для брака
    summary: Дефектный объект получает исправление, пометку или утилизацию; контролёр качества и утилизатор — разные роли.
    cards: [proteostasis-chaperones-proteasome]
    doa_mechanisms: [C-10, C-18, C-19, M-04]
    candidate_tests: ["Подать дефектные объекты и проверить, что каждый ушёл по одному из трёх путей и записан в audit."]
    status: candidate
  - id: P-06
    title: Перегрузка снижает нагрузку
    summary: У контроля качества конечная ёмкость; при перегрузке система ограничивает приток нового, а не пропускает брак.
    cards: [proteostasis-chaperones-proteasome]
    doa_mechanisms: [C-10, C-11, M-02]
    candidate_tests: ["Перегрузить контроль качества и проверить, что приток ограничен, а доля пропущенных дефектов не выросла."]
    status: candidate
  - id: P-07
    title: Резерв на корректное завершение
    summary: Часть ресурса закреплена за процедурой завершения и не расходуется обычной нагрузкой, чтобы при дефиците завершение оставалось управляемым, а не аварийным.
    cards: [atp-and-cell-death-mode]
    doa_mechanisms: [M-12, M-13, C-27, C-28, M-14]
    candidate_tests: ["В изолированной среде исчерпать бюджет организма и проверить, что клетка завершается по протоколу с отзывом прав и итоговой записью, а не уходит в аварийный отказ."]
    status: candidate
  - id: P-08
    title: Быстрый датчик плюс контекст
    summary: Быстрое обнаружение по общим признакам дополняется механизмом, который задаёт контекст и гасит ответ на нормальные события.
    cards: [innate-sensing-and-context]
    doa_mechanisms: [I-04, I-03, I-08]
    candidate_tests: ["Подать нормальные события (плановое обновление, штатное завершение) и проверить, что защита не срабатывает; подать известные атаки и проверить, что срабатывает."]
    status: candidate
  - id: P-09
    title: Датчики проверяют друг друга
    summary: Независимые датчики разного типа взаимодействуют; решение об ответе не принимает один датчик.
    cards: [innate-sensing-and-context]
    doa_mechanisms: [I-04, I-05, I-03]
    candidate_tests: ["Отключить один датчик в изолированной среде и проверить, что ответ на известную атаку сохраняется за счёт других."]
    status: candidate
  - id: P-10
    title: Обучение защиты на своём до развёртывания
    summary: Правило обнаружения проверяется на представительной выборке нормального поведения самого организма до включения; правило, срабатывающее на своём, не допускается.
    cards: [immune-tolerance]
    doa_mechanisms: [I-08, I-06, I-16]
    candidate_tests: ["Прогнать правило по записанной выборке нормальной работы и проверить, что доля ложных срабатываний не выше объявленного предела."]
    status: candidate
  - id: P-11
    title: Второй рубеж против ложных срабатываний
    summary: Отдельный подавитель приостанавливает правило, превысившее бюджет ложных срабатываний, и отправляет его на разбор; подавитель независим от правил, за которыми следит.
    cards: [immune-tolerance]
    doa_mechanisms: [I-08, I-16, M-04]
    candidate_tests: ["Искусственно вызвать серию ложных срабатываний правила и проверить, что оно приостановлено и записано в audit."]
    status: candidate
  - id: P-12
    title: Усиленная защита имеет бюджет ложных срабатываний
    summary: Режим повышенной защиты повышает риск ложных срабатываний, поэтому имеет собственный бюджет и срок действия.
    cards: [immune-tolerance]
    doa_mechanisms: [I-10, I-16, H-02]
    candidate_tests: ["Включить режим усиленной защиты в изолированной среде и проверить, что доля блокировок валидного своего не выходит за объявленный предел, а режим истекает по сроку."]
    status: candidate
  - id: P-13
    title: Тормоз включается самим усиливаемым сигналом
    summary: Продукт усилителя запускает собственный ограничитель, а не только внешний таймер.
    cards: [coagulation-amplification-and-brake]
    doa_mechanisms: [I-12, H-02, I-09]
    candidate_tests: ["Отключить внешний таймер и проверить, что усиление останавливается по собственному ограничителю при достижении порога."]
    status: candidate
  - id: P-14
    title: Усиление не выходит за пределы очага
    summary: Реакция сохраняет локальность, запускающий фактор присутствует только на месте повреждения, граница очага описана явно.
    cards: [coagulation-amplification-and-brake]
    doa_mechanisms: [I-12, I-09, C-24]
    candidate_tests: ["Вызвать срабатывание в одном отсеке и проверить, что соседние отсеки не получили изоляцию или усиление."]
    status: candidate
  - id: P-15
    title: Фазы с выходом из каждой
    summary: Восстановление идёт по фазам; у каждой фазы есть срок и критерий выхода, а затянувшаяся фаза эскалируется.
    cards: [regeneration-and-niche]
    doa_mechanisms: [I-13, I-14, C-29]
    candidate_tests: ["Задержать восстановление в фазе очистки сверх срока в изолированной среде и проверить, что создана эскалация, а не молчаливое продолжение."]
    status: candidate
  - id: P-16
    title: Условия возрождения
    summary: Новый компонент создаётся из доверенного источника и в проверенном окружении, проверка проходит до допуска трафика.
    cards: [regeneration-and-niche]
    doa_mechanisms: [I-14, T-05, E-03]
    candidate_tests: ["Восстановить компонент из эталонного образа в окружении с изменённой конфигурацией и проверить, что аттестация провалена до допуска трафика."]
    status: candidate
  - id: P-17
    title: Амплитуда и срок защитного режима
    summary: Исход восстановления зависит от силы и длительности режима повышенной защиты; его ограничивают и по размеру, и по времени.
    cards: [regeneration-and-niche]
    doa_mechanisms: [I-10, I-13, H-02]
    candidate_tests: ["Провести восстановление после короткого и после затянутого защитного режима и сравнить число оставшихся обходных решений."]
    status: candidate
  - id: P-18
    title: Временное и постоянное старение
    summary: Состояние устарел-ограничен имеет срок и критерий выхода; компонент, оставшийся в нём сверх срока, подлежит замене, но единственный носитель функции не удаляется вслепую.
    cards: [senescence-and-fibrosis-brake]
    doa_mechanisms: [C-30, I-14]
    candidate_tests: ["Довести компонент до срока замены и проверить, что замена идёт по плану, а удаление единственного носителя функции блокируется."]
    status: candidate
  - id: P-19
    title: Обходное решение ограничивает собственное разрастание
    summary: Аварийное обходное решение имеет владельца, срок и лимит числа; иначе оно самоподдерживается и закрепляется.
    cards: [senescence-and-fibrosis-brake]
    doa_mechanisms: [I-15, C-30]
    candidate_tests: ["Создать обходное решение без владельца или срока и проверить, что реестр его отклоняет, а число действующих обходных решений не превышает лимита."]
    status: candidate
  - id: P-20
    title: Быстрое в буфер, в основу после проверки
    summary: Новый факт быстро попадает в буфер; в долговременное хранилище он проходит по пути, зависящему от согласованности; согласованное записывается, противоречащее идёт на проверку источника.
    cards: [memory-consolidation-and-forgetting]
    doa_mechanisms: [N-16, N-14, N-12]
    candidate_tests: ["Подать факт, согласованный с базой знаний, и факт, противоречащий проверенному; проверить, что второй не записан напрямую и ушёл на проверку источника."]
    status: candidate
  - id: P-21
    title: Консолидация в тихом окне
    summary: Перенос в долговременную память выполняется в окне обслуживания при сниженной нагрузке и с перекрёстной проверкой между хранилищами.
    cards: [memory-consolidation-and-forgetting]
    doa_mechanisms: [N-16, N-18, N-13]
    candidate_tests: ["Провести окно консолидации в изолированной среде и проверить, что принятая работа не потеряна, а при пробуждении политика перепроверена."]
    status: candidate
  - id: P-22
    title: Забывание — управляемый процесс
    summary: Удаление и затухание выполняет отдельный контролёр по политике, а не побочные эффекты хранилища.
    cards: [memory-consolidation-and-forgetting]
    doa_mechanisms: [N-17, N-14, N-13]
    candidate_tests: ["Отключить контролёра хранения и проверить, что устаревшие записи обнаруживаются метрикой stale_fact_rate, а после включения удаление подтверждается проверкой."]
    status: candidate
  - id: P-23
    title: Обобщение сохраняет путь к деталям
    summary: Обобщённая запись остаётся связанной с исходными эпизодами, пока не истёк срок хранения.
    cards: [memory-consolidation-and-forgetting]
    doa_mechanisms: [N-16, N-13, N-14]
    candidate_tests: ["Свернуть связанные эпизоды в одну семантическую запись и проверить, что запись прослеживается до каждого исходного эпизода до истечения срока хранения."]
    status: candidate
  - id: P-24
    title: Притормозить всех, разрешить одного, погасить
    summary: Пока выбор не сделан, все предложенные действия удерживаются; решение освобождает ровно одно действие с разрешением и сроком; остальные отменяются и фиксируются; выбранное завершается по сроку.
    cards: [action-selection-basal-ganglia]
    doa_mechanisms: [N-06, N-07, N-05]
    candidate_tests: ["Подать три конкурирующих предложения и проверить, что исполнено ровно одно с разрешением, остальные отменены и записаны, а выбранное действие по сроку отклоняется как просроченное."]
    status: candidate
  - id: P-25
    title: Быстрый путь с границами сверху
    summary: Быстрое правило действует в пределах области, которую верхний уровень задал заранее под задачу, и не расширяет её само.
    cards: [spinal-reflex-bounded-fast-path]
    doa_mechanisms: [N-09, N-05, N-07]
    candidate_tests: ["Подать событие, требующее действия вне заданного набора, и проверить, что быстрое правило не выполняет его и передаёт решение верхнему уровню."]
    status: candidate
  - id: P-26
    title: Усиление учитывает группу
    summary: Быстрые правила связанных компонентов настраиваются с учётом общего состояния группы, а не только собственных показателей.
    cards: [spinal-reflex-bounded-fast-path]
    doa_mechanisms: [N-09, N-02, H-01]
    candidate_tests: ["Нагрузить один компонент группы в изолированной среде и проверить, что пороги быстрых правил соседей изменились согласно политике группы."]
    status: candidate
  - id: P-27
    title: Не смешивать рефлекс и произвольный путь
    summary: Каждое действие приписывается пути, который его вызвал; иначе настройку быстрого пути нельзя измерить.
    cards: [spinal-reflex-bounded-fast-path]
    doa_mechanisms: [N-09, N-06, N-07]
    candidate_tests: ["Выполнить серию действий обоими путями и проверить, что reflex_fired_total считает только действия быстрого пути."]
    status: candidate
  - id: P-28
    title: Упреждение плюс обратная связь
    summary: Регулятор заранее применяет поправку по известной нагрузке, а остаточное отклонение гасит обратной связью.
    cards: [baroreflex-negative-feedback]
    doa_mechanisms: [H-01, M-02, N-02]
    candidate_tests: ["Изменить нагрузку по плану и проверить, что упреждающая поправка применена, а остаточное отклонение погашено обратной связью; отключить датчик и проверить, что отклонение вне допуска вызывает эскалацию."]
    status: candidate
  - id: P-29
    title: Чувствительность контура измеряется отдельно
    summary: Для каждого контура регулирования отдельно измеряется его чувствительность; если измерить нельзя, статус контура — не измерено, а не здоров.
    cards: [baroreflex-negative-feedback]
    doa_mechanisms: [H-01, M-02]
    candidate_tests: ["Отключить датчик контура и проверить, что контур сообщает не измерено, а не здоров."]
    status: candidate
  - id: P-30
    title: Сила обратной связи калибруется с обеих сторон
    summary: Завершение режима реагирования зависит от силы обратной связи; её проверяют и на затягивание режима, и на приглушение реакции.
    cards: [hpa-axis-feedback-and-stress-termination]
    doa_mechanisms: [H-03, H-01, C-29]
    candidate_tests: ["Менять усиление обратной связи в изолированной среде и проверить, что при слабой связи режим STRESSED укладывается в TTL, а при сильной реакция не падает ниже объявленного минимума."]
    status: candidate
  - id: P-31
    title: Рост ёмкости привязан к потребности и завершается упорядочением
    summary: Расширение запускается сигналом потребности; новая ёмкость проходит проверку границ и политики, а лишние пути убираются.
    cards: [angiogenesis-demand-driven-growth]
    doa_mechanisms: [M-05, M-14]
    candidate_tests: ["Подать устойчивый сигнал потребности и проверить, что новая ёмкость прошла проверку границ, а неиспользуемые пути убраны по сроку."]
    status: candidate
  - id: P-32
    title: Лимит роста действует на все маршруты сразу
    summary: Лимит бюджета на рост ёмкости задаётся на сумму маршрутов, а не на каждый механизм отдельно.
    cards: [angiogenesis-demand-driven-growth]
    doa_mechanisms: [M-05, H-02]
    candidate_tests: ["Ограничить один маршрут роста и проверить, что суммарный бюджет ограничивает рост по всем остальным маршрутам."]
    status: candidate
  - id: P-33
    title: Приоритет жизненно важного пути
    summary: При дефиците ёмкости сначала сохраняются заранее объявленные жизненно важные потоки, остальное ограничивается.
    cards: [emergency-circulation-redistribution]
    doa_mechanisms: [M-03, M-02, M-01]
    candidate_tests: ["Создать дефицит ёмкости в изолированной среде и проверить, что потоки идентичности, безопасности, аудита и восстановления сохраняют минимальную ёмкость, а остальные ограничены."]
    status: candidate
  - id: P-34
    title: У аварийного режима есть цена, срок и проверка выхода
    summary: Аварийный режим считает ущерб второстепенным функциям, имеет срок и после выхода проверяется на восстановление нормальной работы.
    cards: [emergency-circulation-redistribution]
    doa_mechanisms: [M-03, C-29, H-02]
    candidate_tests: ["Включить аварийный режим и проверить, что он завершается по сроку, ущерб второстепенным функциям записан, а после выхода нормальная работа подтверждена проверкой."]
    status: candidate
